name: Cold Outreach Background Worker

on:
  schedule:
    # Run every 15 minutes 24/7 to process outreach queue, sync replies, and execute peer warmup
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  process-queue:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Outreach Queue Processor
        run: |
          APP_URL="${{ secrets.APP_URL }}"
          if [ -z "$APP_URL" ]; then
            APP_URL="https://outreacher.arenova.in"
          fi
          CRON_SECRET="${{ secrets.CRON_SECRET }}"
          if [ -z "$CRON_SECRET" ]; then
            CRON_SECRET="dev-cron-secret-12345"
          fi
          echo "Triggering worker at ${APP_URL}/api/jobs/process..."
          curl -s -f -X POST "${APP_URL}/api/jobs/process" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json"
